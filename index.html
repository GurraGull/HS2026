<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IVA Högtidssammankomst 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  @property --sweep { syntax:'<angle>'; inherits:false; initial-value:0deg; }
  :root{ --loop:16s; --ink:#0b1b3a; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#06101f;overflow:hidden;font-family:"Cormorant Garamond",Georgia,serif;color:#fff}

  .stage{position:fixed;inset:0;display:grid;place-items:center;background:#06101f}
  .backdrop{position:absolute;inset:-10%;background:url(assets/stadshuset-wide.webp) center/cover;filter:blur(40px) brightness(.3);transform:scale(1.1)}
  .frame{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;max-width:100%;overflow:hidden;isolation:isolate}

  /* ---- background plate: dusk to dawn, slow push ---- */
  .plate,.sky,.water{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .plate{animation:grade var(--loop) ease-in-out infinite, push var(--loop) ease-in-out infinite}
  .water{clip-path:inset(85% 0 0 0);filter:url(#ripple);animation:grade var(--loop) ease-in-out infinite, push var(--loop) ease-in-out infinite}
  .sky{clip-path:inset(0 0 26% 0);mix-blend-mode:screen;opacity:.3;animation:drift 80s linear infinite alternate, grade var(--loop) ease-in-out infinite}
  @keyframes grade{
    0%  {filter:brightness(.3) saturate(.6) contrast(1.12)}
    22% {filter:brightness(.5) saturate(.75) contrast(1.08)}
    55% {filter:brightness(1)  saturate(1)   contrast(1)}
    86% {filter:brightness(1)  saturate(1)   contrast(1)}
    100%{filter:brightness(.3) saturate(.6) contrast(1.12)}
  }
  @keyframes push{0%{transform:scale(1.06)}50%{transform:scale(1)}100%{transform:scale(1.06)}}
  @keyframes drift{from{transform:scale(1.1) translateX(-1.5%)}to{transform:scale(1.1) translateX(1.5%)}}
  canvas{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen}

  /* ---- the mark: arc sweeps in clockwise, letters settle in afterwards ---- */
  .mark{position:absolute;left:34.25%;top:15.5%;width:31.5%;aspect-ratio:707/591;filter:drop-shadow(0 6px 30px rgba(4,12,30,.55))}
  .mark img{position:absolute;inset:0;width:100%;height:100%}
  .arc{
    --sweep:0deg;
    -webkit-mask:conic-gradient(from 280deg at 55.2% 51.1%, #000 0 var(--sweep), transparent var(--sweep));
            mask:conic-gradient(from 280deg at 55.2% 51.1%, #000 0 var(--sweep), transparent var(--sweep));
    animation:sweep var(--loop) cubic-bezier(.55,0,.12,1) infinite}
  @keyframes sweep{
    0%,18%{--sweep:0deg;opacity:0}
    19%{opacity:1}
    46%{--sweep:216deg;opacity:1}
    88%{--sweep:216deg;opacity:1}
    96%,100%{--sweep:216deg;opacity:0}
  }
  .letters{opacity:0;animation:settle var(--loop) cubic-bezier(.2,.6,.2,1) infinite}
  @keyframes settle{
    0%,40%{opacity:0;filter:blur(14px);transform:translateY(2.5%) scale(1.02)}
    58%{opacity:1;filter:blur(0);transform:none}
    88%{opacity:1;filter:blur(0);transform:none}
    96%,100%{opacity:0;filter:blur(6px);transform:none}
  }
  /* a soft light that follows the arc tip */
  .tip{position:absolute;width:9%;aspect-ratio:1;border-radius:50%;left:50.7%;top:46.6%;
       background:radial-gradient(circle,rgba(255,250,235,.9),rgba(255,240,210,.35) 35%,transparent 70%);
       transform-origin:center;mix-blend-mode:screen;opacity:0;
       animation:tipmove var(--loop) cubic-bezier(.55,0,.12,1) infinite}
  @keyframes tipmove{
    0%,18%{transform:rotate(-170deg) translateX(40.7cqw);opacity:0}
    19%{opacity:1}
    46%{transform:rotate(46deg) translateX(40.7cqw);opacity:1}
    50%,100%{transform:rotate(46deg) translateX(40.7cqw);opacity:0}
  }
  .mark{container-type:inline-size}
  .tipwrap{position:absolute;left:55.2%;top:51.1%;width:0;height:0}
  .tipwrap .tip{left:-4.5cqw;top:-4.5cqw}

  /* ---- type ---- */
  .copy{position:absolute;left:0;right:0;bottom:4.5%;text-align:center;pointer-events:none}
  .copy>*{opacity:0;animation:rise var(--loop) ease-out infinite;animation-delay:var(--d,0s)}
  @keyframes rise{0%,62%{opacity:0;transform:translateY(12px)}70%{opacity:1;transform:none}90%{opacity:1;transform:none}96%,100%{opacity:0}}
  .copy h1{font-weight:300;font-size:clamp(1.4rem,3.4vw,3.6rem);line-height:1.05;letter-spacing:.06em;text-shadow:0 2px 24px rgba(0,0,0,.55)}
  .copy h1 b{font-weight:500}
  .copy .rule{width:3.5vw;height:1px;margin:1.2vw auto;background:rgba(255,255,255,.75);--d:.35s}
  .copy .meta{font-weight:400;font-size:clamp(.75rem,1.4vw,1.35rem);letter-spacing:.3em;text-transform:uppercase;--d:.6s;text-shadow:0 1px 14px rgba(0,0,0,.6)}
  .copy .meta i{font-style:normal;opacity:.6;margin:0 .5em}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,16,31,.15) 0%,transparent 30%,transparent 60%,rgba(6,16,31,.82) 100%);pointer-events:none}

  .hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);font:300 12px/1 "Cormorant Garamond";letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3)}
  @media (prefers-reduced-motion:reduce){*{animation-duration:0.001s!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop"></div>
  <div class="frame" id="frame">
    <img class="plate" src="assets/stadshuset-wide.webp" alt="Stockholms stadshus i gryningen">
    <img class="sky"   src="assets/stadshuset-wide.webp" alt="" aria-hidden="true">
    <img class="water" src="assets/stadshuset-wide.webp" alt="" aria-hidden="true">
    <canvas id="sun"></canvas>
    <div class="shade"></div>

    <div class="mark" aria-label="IVA">
      <img class="arc"     src="assets/iva-arc.png"     alt="">
      <img class="letters" src="assets/iva-letters.png" alt="IVA">
      <div class="tipwrap"><div class="tip"></div></div>
    </div>

    <div class="copy">
      <h1>107:e <b>Högtidssammankomsten</b></h1>
      <div class="rule"></div>
      <div class="meta">Stockholms stadshus<i>·</i>23 oktober 2026</div>
    </div>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="ripple" x="0" y="0" width="100%" height="100%">
        <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.012 0.08" numOctaves="2" seed="3" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>
  </div>
</div>
<div class="hint">klicka för helskärm · mellanslag pausar</div>

<script>
(() => {
  const LOOP = 16000;
  const frame = document.getElementById('frame');
  const sun = document.getElementById('sun'), sc = sun.getContext('2d');
  const turb = document.getElementById('turb');
  let W, H, dpr = Math.min(devicePixelRatio || 1, 2);
  function resize(){ const r = frame.getBoundingClientRect(); W = r.width; H = r.height;
    sun.width = W*dpr; sun.height = H*dpr; sc.setTransform(dpr,0,0,dpr,0,0); }
  addEventListener('resize', resize); resize();

  const SUN = {x:0.694, y:0.79};
  const ease = t => t<0?0:t>1?1:t*t*(3-2*t);
  let paused = false, t0 = performance.now();

  function tick(now){
    requestAnimationFrame(tick);
    if (paused) return;
    const el = now - t0, ph = (el % LOOP) / LOOP;
    const light = ease((ph-.2)/.35) * (1-ease((ph-.88)/.1));
    sc.clearRect(0,0,W,H);
    if (light > 0){
      const sx = SUN.x*W, sy = SUN.y*H, breathe = 1 + 0.03*Math.sin(el/1800);
      const g = sc.createRadialGradient(sx,sy,0,sx,sy,W*0.4*breathe);
      g.addColorStop(0,`rgba(255,238,200,${0.65*light})`);
      g.addColorStop(0.1,`rgba(255,205,130,${0.28*light})`);
      g.addColorStop(0.4,`rgba(255,160,80,${0.08*light})`);
      g.addColorStop(1,'rgba(255,140,60,0)');
      sc.fillStyle = g; sc.fillRect(0,0,W,H);
      // reflection on the water
      const wg = sc.createLinearGradient(0,H*0.86,0,H);
      wg.addColorStop(0,`rgba(255,215,150,${0.3*light})`); wg.addColorStop(1,'rgba(255,215,150,0)');
      sc.fillStyle = wg; sc.beginPath();
      sc.moveTo(sx-W*0.012,H*0.86); sc.lineTo(sx+W*0.012,H*0.86); sc.lineTo(sx+W*0.06,H); sc.lineTo(sx-W*0.06,H); sc.closePath(); sc.fill();
    }
    turb.setAttribute('baseFrequency', `${(0.012+0.002*Math.sin(el/700)).toFixed(4)} ${(0.08+0.01*Math.cos(el/900)).toFixed(4)}`);
    turb.setAttribute('seed', Math.floor(el/180) % 50);
  }
  requestAnimationFrame(tick);

  addEventListener('keydown', e => { if (e.code==='Space'){ e.preventDefault(); paused=!paused;
    document.querySelectorAll('.frame *').forEach(el=>el.style.animationPlayState = paused?'paused':'running'); }});
  frame.addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
})();
</script>
</body>
</html>
