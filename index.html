<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IVA Högtidssammankomst 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  @property --sweep { syntax:'<angle>'; inherits:false; initial-value:0deg; }
  :root{ --loop:18s; --ink:#0b1b3a; color-scheme:dark }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;margin:0;background:#06101f;overflow:hidden;font-family:"Cormorant Garamond",Georgia,serif;color:#fff}

  .stage{position:fixed;inset:0;display:grid;place-items:center;background:#06101f}
  .backdrop{position:absolute;inset:-10%;background:url(assets/stadshuset-clean.webp) center/cover;filter:blur(40px) brightness(.3);transform:scale(1.1)}
  .frame{position:relative;width:min(100vw,100vh);height:min(100vw,100vh);overflow:hidden;isolation:isolate;cursor:crosshair}

  /* ---- parallax plate (WebGL), dusk to dawn via CSS filter ---- */
  #gl{position:absolute;inset:0;width:100%;height:100%;animation:grade var(--loop) ease-in-out infinite}
  @keyframes grade{
    0%  {filter:brightness(.3) saturate(.6) contrast(1.12)}
    22% {filter:brightness(.5) saturate(.75) contrast(1.08)}
    55% {filter:brightness(1)  saturate(1)   contrast(1)}
    88% {filter:brightness(1)  saturate(1)   contrast(1)}
    100%{filter:brightness(.3) saturate(.6) contrast(1.12)}
  }
  #sun{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen}

  /* ---- the mark: arc sweeps in clockwise, letters settle in afterwards ---- */
  .mark{position:absolute;left:22%;top:15.5%;width:56%;aspect-ratio:707/591;filter:drop-shadow(0 6px 30px rgba(4,12,30,.55));will-change:transform}
  .mark img{position:absolute;inset:0;width:100%;height:100%}
  .arc{
    --sweep:0deg;
    -webkit-mask:conic-gradient(from 280deg at 55.2% 51.1%, #000 0 var(--sweep), transparent var(--sweep));
            mask:conic-gradient(from 280deg at 55.2% 51.1%, #000 0 var(--sweep), transparent var(--sweep));
    animation:sweep var(--loop) cubic-bezier(.55,0,.12,1) infinite}
  @keyframes sweep{
    0%,18%{--sweep:0deg;opacity:0}
    19%{opacity:1}
    46%{--sweep:216deg;opacity:1}
    90%{--sweep:216deg;opacity:1}
    97%,100%{--sweep:216deg;opacity:0}
  }
  .letters{opacity:0;animation:settle var(--loop) cubic-bezier(.2,.6,.2,1) infinite}
  @keyframes settle{
    0%,40%{opacity:0;filter:blur(14px);transform:translateY(2.5%) scale(1.02)}
    58%{opacity:1;filter:blur(0);transform:none}
    90%{opacity:1;filter:blur(0);transform:none}
    97%,100%{opacity:0;filter:blur(6px);transform:none}
  }
  .mark{container-type:inline-size}
  .tipwrap{position:absolute;left:55.2%;top:51.1%;width:0;height:0}
  .tip{position:absolute;left:-4.5cqw;top:-4.5cqw;width:9cqw;height:9cqw;border-radius:50%;
       background:radial-gradient(circle,rgba(255,250,235,.9),rgba(255,240,210,.35) 35%,transparent 70%);
       mix-blend-mode:screen;opacity:0;animation:tipmove var(--loop) cubic-bezier(.55,0,.12,1) infinite}
  @keyframes tipmove{
    0%,18%{transform:rotate(-170deg) translateX(40.7cqw);opacity:0}
    19%{opacity:1}
    46%{transform:rotate(46deg) translateX(40.7cqw);opacity:1}
    50%,100%{transform:rotate(46deg) translateX(40.7cqw);opacity:0}
  }

  /* ---- type ---- */
  .copy{position:absolute;left:0;right:0;bottom:4.5%;text-align:center;pointer-events:none;will-change:transform}
  .copy>*{opacity:0;animation:rise var(--loop) ease-out infinite;animation-delay:var(--d,0s)}
  @keyframes rise{0%,62%{opacity:0;transform:translateY(12px)}70%{opacity:1;transform:none}91%{opacity:1;transform:none}97%,100%{opacity:0}}
  .copy h1{font-weight:300;font-size:clamp(1.6rem,5.2vmin,3.6rem);line-height:1.05;letter-spacing:.06em;text-shadow:0 2px 24px rgba(0,0,0,.55);text-wrap:balance}
  .copy h1 b{font-weight:500}
  .copy .rule{width:5.5vmin;height:1px;margin:1.6vmin auto;background:rgba(255,255,255,.75);--d:.35s}
  .copy .meta{font-weight:400;font-size:clamp(.85rem,2.2vmin,1.35rem);letter-spacing:.3em;text-transform:uppercase;--d:.6s;text-shadow:0 1px 14px rgba(0,0,0,.6)}
  .copy .meta i{font-style:normal;opacity:.6;margin:0 .5em}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,16,31,.15) 0%,transparent 30%,transparent 60%,rgba(6,16,31,.82) 100%);pointer-events:none}

  .hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);font:300 12px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{animation-duration:0.001s!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop"></div>
  <div class="frame" id="frame">
    <canvas id="gl"></canvas>
    <canvas id="sun"></canvas>
    <div class="shade"></div>

    <div class="mark" id="mark" aria-label="IVA">
      <img class="arc"     src="assets/iva-arc.png"     alt="">
      <img class="letters" src="assets/iva-letters.png" alt="IVA">
      <div class="tipwrap"><div class="tip"></div></div>
    </div>

    <div class="copy" id="copy">
      <h1>107:e <b>Högtidssammankomsten</b></h1>
      <div class="rule"></div>
      <div class="meta">Stockholms stadshus<i>·</i>23 oktober 2026</div>
    </div>
  </div>
</div>
<div class="hint">rör musen för att se djupet · klick ger helskärm · mellanslag pausar</div>

<script>
(() => {
  const LOOP = 18000;
  const frame = document.getElementById('frame');
  const glc = document.getElementById('gl'), sun = document.getElementById('sun'), sc = sun.getContext('2d');
  const mark = document.getElementById('mark'), copy = document.getElementById('copy');
  const dpr = Math.min(devicePixelRatio || 1, 2);
  let W, H;

  /* ---------- WebGL: depth-displaced parallax ---------- */
  const gl = glc.getContext('webgl', {antialias:false, premultipliedAlpha:false});
  const VS = `attribute vec2 a; varying vec2 v; void main(){ v = a*0.5+0.5; gl_Position = vec4(a,0.,1.); }`;
  const FS = `
    precision highp float; varying vec2 v;
    uniform sampler2D img, dep; uniform vec2 off; uniform float t, zoom;
    void main(){
      vec2 uv = (v - 0.5) / zoom + 0.5;                 // zoom in a little so displaced edges never show
      float d = texture2D(dep, uv).r;                    // 0 = far sky, 1 = near water
      vec2 p = uv + off * (d - 0.3);                     // near moves with the camera, far against it
      float w = smoothstep(0.6, 0.75, d);                // water only
      p.x += w * 0.0012 * sin(uv.y * 140.0 + t * 1.7) * sin(uv.x * 23.0 + t * 0.4);
      p.y += w * 0.0008 * sin(uv.x * 95.0 - t * 1.2);
      gl_FragColor = texture2D(img, p);
    }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const aLoc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(prog, n);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  function tex(unit, src, done){
    const t = gl.createTexture(); const im = new Image(); im.src = src;
    im.onload = () => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, im);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); done(); };
  }
  let ready = 0;
  tex(0, 'assets/stadshuset-clean.webp', () => ready++);
  tex(1, 'assets/stadshuset-depth.png',  () => ready++);
  gl.uniform1i(U('img'), 0); gl.uniform1i(U('dep'), 1);

  function resize(){
    const r = frame.getBoundingClientRect(); W = r.width; H = r.height;
    glc.width = W*dpr; glc.height = H*dpr; gl.viewport(0, 0, glc.width, glc.height);
    sun.width = W*dpr; sun.height = H*dpr; sc.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize', resize); resize();

  /* ---------- camera: slow drift plus pointer ---------- */
  const target = {x:0, y:0}, cam = {x:0, y:0};
  frame.addEventListener('pointermove', e => { const r = frame.getBoundingClientRect();
    target.x = ((e.clientX - r.left)/r.width - 0.5) * 2; target.y = ((e.clientY - r.top)/r.height - 0.5) * 2; });
  frame.addEventListener('pointerleave', () => { target.x = 0; target.y = 0; });

  const SUN = {x:0.845, y:0.79};
  const ease = t => t<0?0:t>1?1:t*t*(3-2*t);
  let paused = false, t0 = performance.now(), fixed = null;
  // external clock for frame-exact rendering (video export): sets JS time and every CSS animation
  window.__setTime = ms => { fixed = ms; document.getAnimations().forEach(a => { a.pause(); a.currentTime = ms; }); render(performance.now()); };

  function tick(now){ requestAnimationFrame(tick); if (paused || fixed !== null) return; render(now); }
  function render(now){
    const el = fixed ?? (now - t0), s = el/1000, ph = (el % LOOP) / LOOP;

    // camera: a Lissajous drift the eye reads as a slow dolly, plus the pointer
    cam.x += (target.x - cam.x) * 0.04; cam.y += (target.y - cam.y) * 0.04;
    const ox = 0.55*Math.sin(s*0.23) + 0.45*cam.x, oy = 0.35*Math.sin(s*0.17 + 1.3) + 0.35*cam.y;   // -1..1
    const PAR = 0.035;                                                                            // parallax strength (uv units)

    if (ready === 2){
      gl.uniform2f(U('off'), ox*PAR, -oy*PAR);
      gl.uniform1f(U('t'), s); gl.uniform1f(U('zoom'), 1.07 + 0.03*Math.sin(s*0.11));
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    // the mark floats in front of the scene; the text a little less
    mark.style.transform = `translate(${-ox*1.6}%, ${-oy*1.2}%)`;
    copy.style.transform = `translate(${-ox*0.8}%, ${-oy*0.6}%)`;

    // sun bloom, following the dawn curve and shifted with the far layer
    const light = ease((ph-.2)/.35) * (1-ease((ph-.9)/.08));
    sc.clearRect(0,0,W,H);
    if (light > 0){
      const sx = (SUN.x + ox*PAR*0.6)*W, sy = (SUN.y + oy*PAR*0.6)*H, breathe = 1 + 0.03*Math.sin(el/1800);
      const g = sc.createRadialGradient(sx,sy,0,sx,sy,W*0.6*breathe);
      g.addColorStop(0,`rgba(255,238,200,${0.65*light})`);
      g.addColorStop(0.1,`rgba(255,205,130,${0.28*light})`);
      g.addColorStop(0.4,`rgba(255,160,80,${0.08*light})`);
      g.addColorStop(1,'rgba(255,140,60,0)');
      sc.fillStyle = g; sc.fillRect(0,0,W,H);
      const wg = sc.createLinearGradient(0,H*0.86,0,H);
      wg.addColorStop(0,`rgba(255,215,150,${0.3*light})`); wg.addColorStop(1,'rgba(255,215,150,0)');
      sc.fillStyle = wg; sc.beginPath();
      sc.moveTo(sx-W*0.02,H*0.86); sc.lineTo(sx+W*0.02,H*0.86); sc.lineTo(sx+W*0.1,H); sc.lineTo(sx-W*0.1,H); sc.closePath(); sc.fill();
    }
  }
  requestAnimationFrame(tick);

  addEventListener('keydown', e => { if (e.code==='Space'){ e.preventDefault(); paused=!paused;
    document.querySelectorAll('.frame *').forEach(el=>el.style.animationPlayState = paused?'paused':'running'); }});
  frame.addEventListener('click', () => { const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); p && p.catch(()=>{}); });
})();
</script>
</body>
</html>
